title = "Airodrom public candidate secret policy"
[extend]
useDefault = true

[[allowlists]]
description = "Non-secret canonical invariant key; exact identifier only"
condition = "AND"
paths = ["(^|/)config/architecture\\-memory\\-sources\\-v1\\.json$"]
regexTarget = "secret"
regexes = ["^04\\-results\\-acceptance$"]

[[allowlists]]
description = "Non-secret canonical invariant key; exact identifier only"
