[[allowlists]]
description = "Synthetic .invalid/argv persistence-rejection fixture"
condition = "AND"
paths = ["(^|/)tests/memory\\-erasure\\-lifecycle\\.test\\.js$"]
regexTarget = "secret"
regexes = ["^crsr[_]fixtureSecretNeverPersist123$"]

[[allowlists]]
description = "Synthetic alphabet-pattern credential rejection fixture"
condition = "AND"
paths = ["(^|/)tests/capability\\-expansion\\-v2\\.test\\.js$"]
regexTarget = "secret"
regexes = ["^ghp_ZYXWVUTSRQPONMLKJIHGFEDCBA9876543210zz$"]

[[allowlists]]
description = "Synthetic alphabet-pattern credential rejection fixture"
condition = "AND"
paths = ["(^|/)tests/capability\\-expansion\\-v2\\.test\\.js$"]
regexTarget = "secret"
regexes = ["^ghp_ZYXWVUTSRQPONMLKJIHGFEDCBA9876543210$"]

# Exact captured token only. No path condition: gitleaks 8.30.1 path+regex
# allowlists suppressed other credentials in the same file.
[[allowlists]]
description = "Non-secret JavaScript property comparison; exact captured text only"
regexTarget = "secret"
regexes = ["^a\\.idempotency_key===$"]
